[tools]
actionlint = "1.7.12"
rust = "1.97.1"
cargo-binstall = "1.22.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
just = "1.58.0"

[settings]
cargo.binstall_only = true
cargo.binstall_quickinstall = true
lockfile = true

[tasks.actionlint]
run = "actionlint"

[tasks.build]
run = "cargo build --workspace --locked"

[tasks.test]
run = "cargo nextest run --workspace --locked"

[tasks.lint]
run = "rustup component add clippy && cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "rustup component add rustfmt && cargo fmt --all --check"

[tasks.l2-closure]
run = "cargo run --locked -p l2-contract -- validate"

[tasks.l2-test]
run = "cargo nextest run --workspace --locked"

[tasks.check]
depends = ["actionlint", "l2-closure", "l2-test"]
