[tools]
actionlint = "1.7.12"
rust = "1.98.0"
cargo-binstall = "1.22.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
just = "1.58.0"

[settings]
cargo.binstall_only = true
cargo.binstall_quickinstall = true
lockfile = true

[tasks.actionlint]
run = "actionlint"

[tasks.workflow-check]
run = "just workflow-check"

[tasks.python-check]
run = "just python-check"

[tasks.capability-audit]
run = "just capability-audit"

[tasks.rust-check]
run = "just rust-check"

[tasks.rust-test]
run = "just rust-test"

[tasks.build]
run = "cargo build --workspace --locked"

[tasks.test]
run = "cargo nextest run --workspace --locked"

[tasks.lint]
run = "rustup component add clippy && cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "rustup component add rustfmt && cargo fmt --all --check"

[tasks.l2-closure]
run = "just l2-closure"

[tasks.audit-workflows]
run = "just audit-workflows"

[tasks.check]
depends = ["workflow-check", "audit-workflows", "capability-audit", "fmt", "rust-check", "rust-test", "l2-closure"]
