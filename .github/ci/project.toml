[release]
enabled = false
reason = "Release is fail-closed. Enable only after declaring immutable artifact, registry, provenance, and tag-protection policy."

[[unit]]
id = "docker"
label = "Docker"
kind = "docker"
root = "."
watch = ["**"]
pr_commands = ["docker build --file 'Dockerfile.fixture' --tag local-ci:dockerfile-fixture '.'"]
