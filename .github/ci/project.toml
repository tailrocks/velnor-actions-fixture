[[unit]]
id = "docs"
label = "Documentation"
kind = "docs"
root = "."
watch = ["**/*.md", "mkdocs.yml", "docs/**"]
pr_commands = ["npx --yes markdownlint-cli2@0.20.0 \"**/*.md\" \"#node_modules\" \"#**/AGENTS.md\" \"#**/CLAUDE.md\" \"#target\" \"#**/target/**\" \"#dist\" \"#coverage\" \"#**/.cache/**\""]
