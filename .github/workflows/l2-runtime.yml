name: l2-runtime

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Runner lane.
        required: true
        type: choice
        default: both
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: l2-runtime-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lane == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lane)) }}
    runs-on: ${{ matrix.lane == 'velnor' && fromJSON('{"group":"velnor-trusted","labels":"velnor-target-mvp"}') || 'ubuntu-26.04' }}
    timeout-minutes: 25
    env:
      CACHE_NAMESPACE: l2-${{ github.run_id }}-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Validate complete recursive closure
        run: cargo run --locked -p l2-contract -- validate
      - id: closure
        uses: ./.github/actions/l2-root
      - name: Assert closure output
        run: test '${{ steps.closure.outputs.closure }}' = 'root,nested,remote'
      - name: Create root-cache bytes
        run: mkdir -p .l2-cache/root && printf '%s\n' root-cache > .l2-cache/root/value
      - name: Save root cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .l2-cache/root
          key: ${{ env.CACHE_NAMESPACE }}-root
      - name: Clear root-cache bytes
        run: rm -rf .l2-cache/root
      - id: restore-root
        name: Restore root cache exactly
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .l2-cache/root
          key: ${{ env.CACHE_NAMESPACE }}-root
          fail-on-cache-miss: "true"
      - name: Verify root-cache bytes
        run: test "$(cat .l2-cache/root/value)" = root-cache
      - id: restore-only
        name: Restore-only miss
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .l2-cache/restore-only
          key: ${{ env.CACHE_NAMESPACE }}-restore-only
          lookup-only: "true"
      - name: Assert restore-only did not save
        run: test '${{ steps.restore-only.outputs.cache-hit }}' != 'true'
      - name: Run non-empty locked corpus
        run: cargo nextest run --workspace --locked
      - name: Record exact mise version
        run: |
          mise --version
          rustc --version --verbose

  runtime-required:
    if: always()
    needs: runtime
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable matrix row
        env:
          RESULT: ${{ needs.runtime.result }}
        run: test "${RESULT}" = success
