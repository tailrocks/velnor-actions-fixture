name: reuse-caller

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Runner lane(s): velnor / github / both'
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read
  actions: read

concurrency:
  group: reuse-caller-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Call the reusable workflow — mirrors ChainArgos kestra and Jackin composite patterns.
  # Each lane calls the same reusable workflow with secrets: inherit.
  call-app-a:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true}]') }}
    uses: ./.github/workflows/fixture-rust-check.yml
    secrets: inherit
    with:
      package: app-a
      runner: ${{ toJSON(matrix.config.runner) }}
      cache-key-suffix: ${{ matrix.config.lane }}

  call-app-b:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true}]') }}
    uses: ./.github/workflows/fixture-rust-check.yml
    secrets: inherit
    with:
      package: app-b
      runner: ${{ toJSON(matrix.config.runner) }}
      cache-key-suffix: ${{ matrix.config.lane }}

  reuse-required:
    if: always()
    needs: [call-app-a, call-app-b]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/aggregate-needs
        with:
          needs-json: ${{ toJSON(needs) }}
          workflow-label: reuse-caller
