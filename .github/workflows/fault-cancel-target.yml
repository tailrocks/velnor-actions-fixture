# Repo-owned cancellation victim for fault-suite.yml cancel-victim. Runs only
# when dispatched through the API by the fault suite (or manually for
# diagnosis): the dispatcher cancels the run mid-step and before start and
# asserts the runner-computed conclusions. Dispatch-only by design: a victim
# with nothing racing it proves nothing. Follows the fixture #143 hand-owned
# pattern. Not generator output: edit here.
name: fault-cancel-target

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "velnor | github | both (default: both)"
        type: choice
        default: both
        options: [velnor, github, both]

# The victim needs no permissions at all: it sleeps, then records whether
# cancelled() held. It publishes no artifacts and touches no cache, so a
# cancelled run must leave zero residue for the dispatcher to find.
permissions: {}

concurrency:
  group: fault-cancel-target-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  victim:
    name: victim (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lanes == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lanes)) }}
    runs-on: ${{ matrix.lane == 'velnor' && fromJSON('{"group":"velnor-trusted","labels":"velnor-target-mvp"}') || 'ubuntu-26.04' }}
    timeout-minutes: 10
    concurrency:
      group: fault-cancel-target-${{ github.run_id }}-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - id: long-sleep
        name: long-sleep
        run: sleep 300
      - id: cancelled-marker
        name: cancelled-marker
        if: cancelled()
        run: echo "cancelled() held" >> "${GITHUB_STEP_SUMMARY}"
