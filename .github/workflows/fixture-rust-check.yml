name: fixture-rust-check

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Cargo package name to check.
      runner:
        required: false
        type: string
        default: '"ubuntu-26.04"'
        description: Runner label as JSON string (e.g. '"ubuntu-26.04"' or '["self-hosted","velnor-target-mvp"]').
      cache-key-suffix:
        required: false
        type: string
        default: 'github'
        description: Lane component for the rust-cache shared-key (e.g. 'github' or 'velnor') so lanes do not share one cache.
    secrets:
      github-token:
        required: false
        description: Optional GitHub token override.

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust-check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      FIXTURE_PACKAGE: ${{ inputs.package }}
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fixture-reusable-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ inputs.package }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fixture-reusable-${{ inputs.cache-key-suffix }}-${{ runner.os }}-
      - run: cargo check -p "${FIXTURE_PACKAGE}" --locked
      - run: |
          echo "### reusable rust-check: ${FIXTURE_PACKAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "reusable-check-passed=true" >> "${GITHUB_OUTPUT}"
