name: fixture-rust-check

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
      package:
        required: true
        type: string
        description: Cargo package name to check.
      runner:
        required: false
        type: string
        default: '"ubuntu-26.04"'
        description: Runner label as JSON string (e.g. '"ubuntu-26.04"' or '["self-hosted","velnor-target-mvp"]').
      cache-key-suffix:
        required: false
        type: string
        default: 'github'
        description: Lane component for the rust-cache shared-key (e.g. 'github' or 'velnor') so lanes do not share one cache.
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Cargo package name to check.
      runner:
        required: false
        type: string
        default: '"ubuntu-26.04"'
        description: Runner label as JSON string (e.g. '"ubuntu-26.04"' or '["self-hosted","velnor-target-mvp"]').
      cache-key-suffix:
        required: false
        type: string
        default: 'github'
        description: Lane component for the rust-cache shared-key (e.g. 'github' or 'velnor') so lanes do not share one cache.
    secrets:
      github-token:
        required: false
        description: Optional GitHub token override.

permissions:
  contents: read

concurrency:
  # Include the lane (cache-key-suffix) so a lanes=both caller cannot cancel its own
  # sibling lane: both lanes call this workflow concurrently for the same package.
  group: fixture-rust-check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package }}-${{ inputs.cache-key-suffix }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust-check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    env:
      FIXTURE_PACKAGE: ${{ inputs.package }}
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fixture-reusable-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ inputs.package }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fixture-reusable-${{ inputs.cache-key-suffix }}-${{ runner.os }}-
      # Target-cache key dims are compatible only (lane, os, job, package,
      # toolchain via mise.toml, Cargo manifests+lock). No github.sha: the
      # commit is not a cache dimension, and embedding it forced a fresh entry
      # per push.
      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: fixture-target-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ github.job }}-${{ inputs.package }}-${{ hashFiles('mise.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: fixture-target-${{ inputs.cache-key-suffix }}-${{ runner.os }}-${{ github.job }}-${{ inputs.package }}-${{ hashFiles('mise.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      - run: cargo check -p "${FIXTURE_PACKAGE}" --locked
      - run: |
          echo "### reusable rust-check: ${FIXTURE_PACKAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "reusable-check-passed=true" >> "${GITHUB_OUTPUT}"
