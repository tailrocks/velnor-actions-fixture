name: l2-provenance

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Producer lane selection.
        required: true
        type: choice
        default: both
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: l2-provenance-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  admit-default-head:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require current default-branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          default_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "${GITHUB_SHA}" = "${default_head}"

  produce:
    needs: admit-default-head
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lane == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lane)) }}
    runs-on: ${{ matrix.lane == 'velnor' && fromJSON('{"group":"velnor-trusted","labels":"velnor-target-mvp"}') || 'ubuntu-26.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Prove log masking
        env:
          MASK_SENTINEL: ${{ secrets.FIXTURE_MASK_SENTINEL }}
        run: |
          test -n "${MASK_SENTINEL}"
          echo "::add-mask::${MASK_SENTINEL}"
          echo "masking-marker-${{ matrix.lane }}-begin"
          printf 'masked-sentinel=%s\n' "${MASK_SENTINEL}"
          echo "masking-marker-${{ matrix.lane }}-end"
      - name: Build and test exact subject
        run: |
          cargo nextest run --workspace --locked
          mkdir -p dist
          cargo run --locked -p l2-contract -- subject "${GITHUB_SHA}" > dist/l2-subject.json
          (cd dist && sha256sum l2-subject.json > l2-subject.json.sha256)
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/l2-subject.json
      - name: Bind exact producer evidence
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          test -s "${BUNDLE_PATH}"
          cp -- "${BUNDLE_PATH}" "dist/l2-${{ matrix.lane }}.bundle.jsonl"
          jq -cn \
            --arg lane "${{ matrix.lane }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg job "${GITHUB_JOB}" \
            --arg runner_environment "${RUNNER_ENVIRONMENT}" \
            --arg attestation_id "${ATTESTATION_ID}" \
            '{schema:"velnor.fixture.l2-producer.v1",lane:$lane,run_id:$run_id,run_attempt:$run_attempt,job:$job,runner_environment:$runner_environment,attestation_id:$attestation_id}' \
            > "dist/l2-${{ matrix.lane }}.producer.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l2-${{ matrix.lane }}
          path: dist
          if-no-files-found: error

  consume:
    if: always() && needs.produce.result == 'success'
    needs: produce
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: l2-*
          path: evidence
      - name: Reconstruct and compare exact subjects before attestation
        run: |
          mapfile -t subjects < <(find evidence -name l2-subject.json -type f | sort)
          if [ "${{ inputs.lane }}" = both ]; then
            expected_lanes='["github","velnor"]'
          else
            expected_lanes='["${{ inputs.lane }}"]'
          fi
          mapfile -t producers < <(find evidence -name 'l2-*.producer.json' -type f | sort)
          test "${#producers[@]}" -eq "${#subjects[@]}"
          observed_lanes="$(jq -sc 'map(.lane) | sort' "${producers[@]}")"
          test "${observed_lanes}" = "$(jq -cS . <<< "${expected_lanes}")"
          expected="$(mktemp)"
          expected_checksum="$(mktemp)"
          trap 'rm -f "${expected}" "${expected_checksum}"' EXIT
          jq -cn --arg source_sha "${GITHUB_SHA}" \
            '{schema:"velnor.fixture.l2-subject.v1",source_sha:($source_sha|ascii_downcase),workload:"cargo-nextest-workspace-locked"}' \
            > "${expected}"
          expected_sha="$(sha256sum "${expected}" | awk '{print $1}')"
          printf '%s  l2-subject.json\n' "${expected_sha}" > "${expected_checksum}"
          for subject in "${subjects[@]}"; do
            lane="$(jq -er .lane "$(find "$(dirname "${subject}")" -maxdepth 1 -name 'l2-*.producer.json' -type f)")"
            cp -- "${expected_checksum}" "consumer-l2-${lane}-subject.json.sha256"
            cp -- "${expected_checksum}" "$(dirname "${subject}")/consumer-l2-subject.json.sha256"
            (cd "$(dirname "${subject}")" && sha256sum --check --strict consumer-l2-subject.json.sha256)
            cmp -- "${expected}" "${subject}"
          done
      - name: Verify exact source and signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r producer; do
            lane="$(jq -er .lane "${producer}")"
            artifact_root="$(dirname "${producer}")"
            subject="${artifact_root}/l2-subject.json"
            bundle="${artifact_root}/l2-${lane}.bundle.jsonl"
            test -s "${bundle}"
            test -s "${producer}"
            args=()
            if [ "${lane}" = github ]; then
              args+=(--deny-self-hosted-runners)
              expected_environment=github-hosted
              expected_job=produce
            elif [ "${lane}" = velnor ]; then
              expected_environment=self-hosted
              expected_job=velnor
            else
              echo "unexpected producer artifact ${lane}" >&2
              exit 1
            fi
            gh attestation verify "${subject}" --bundle "${bundle}" "${args[@]}" \
              --repo tailrocks/velnor-actions-fixture \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --signer-workflow github.com/tailrocks/velnor-actions-fixture/.github/workflows/l2-provenance.yml \
              --signer-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "verification-${lane}.json"
            jq -e \
              --arg environment "${expected_environment}" \
              --arg invocation "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
              'length == 1 and .[0].verificationResult.signature.certificate.runnerEnvironment == $environment and .[0].verificationResult.signature.certificate.runInvocationURI == $invocation' \
              "verification-${lane}.json" >/dev/null
            jq -e \
              --arg lane "${lane}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg environment "${expected_environment}" \
              --arg job "${expected_job}" \
              '.schema == "velnor.fixture.l2-producer.v1" and .lane == $lane and .run_id == $run_id and .run_attempt == $run_attempt and .job == $job and .runner_environment == $environment and (.attestation_id | length > 0)' \
              "${producer}" >/dev/null
          done < <(find evidence -name 'l2-*.producer.json' -type f | sort)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l2-verification-${{ inputs.lane }}
          path: |
            verification-*.json
            consumer-l2-*-subject.json.sha256
          if-no-files-found: error
