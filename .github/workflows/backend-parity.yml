# Canonical extra fixture workflow. Copy into tailrocks/velnor-actions-fixture
# as .github/workflows/backend-parity.yml. Does not add a repository-controlled
# backend input. Pool selection (docker vs microvm) is operator execution.toml.
# lanes remains velnor | github | both; automatic runs always select both.
# This is a positive backend probe, not a hosted-only diagnostic.

name: backend-parity
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "velnor | github | both (default: both)"
        type: choice
        default: both
        options: [velnor, github, both]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: backend-parity (${{ matrix.config.lane }})
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    concurrency:
      group: backend-parity-${{ github.run_id }}-${{ matrix.config.lane }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'both')) && format('{0}', '[{"lane":"GitHub","runner":"ubuntu-26.04"},{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"}}]') || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && format('{0}', '[{"lane":"GitHub","runner":"ubuntu-26.04"}]') || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'velnor') && format('{0}', '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"}}]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Record pool backend
        id: backend
        env:
          LANE: ${{ matrix.config.lane }}
        run: |
          set -euo pipefail
          case "${LANE,,}" in
            github)
              backend=github-hosted
              ;;
            velnor)
              backend="${VELNOR_EXECUTION_BACKEND:-}"
              if [[ -z "${backend}" ]]; then
                echo "::error::VELNOR_EXECUTION_BACKEND is required on the Velnor lane"
                exit 1
              fi
              case "${backend}" in
                docker|microvm) ;;
                *)
                  echo "::error::invalid VELNOR_EXECUTION_BACKEND: ${backend}"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::unsupported backend lane: ${LANE}"
              exit 1
              ;;
          esac
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          {
            echo "lane=${LANE}"
            echo "execution_backend=${backend}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Run fixture-harness tests and examples
        env:
          LANE: ${{ matrix.config.lane }}
          BACKEND: ${{ steps.backend.outputs.backend }}
        run: |
          set -euo pipefail
          cargo nextest run --locked -p fixture-harness --all-targets
          cargo run --quiet --locked -p fixture-harness --example command_files
          tmp_dir="$(mktemp -d)"
          mkdir -p "${tmp_dir}/tree/nested"
          printf '%s\n' alpha > "${tmp_dir}/tree/nested/a.txt"
          cargo run --quiet --locked -p fixture-harness --example artifact_tree -- "${tmp_dir}/tree" > "${tmp_dir}/tree.txt"
          test -s "${tmp_dir}/tree.txt"
          cargo run --quiet --locked -p fixture-harness --example cache_payload -- backend "${LANE}" > "${tmp_dir}/cache.txt"
          grep -q '^velnor.fixture.cache.v1$' "${tmp_dir}/cache.txt"
          printf '%s\n' release > "${tmp_dir}/fixture.tar.gz"
          cargo run --quiet --locked -p fixture-harness --example release_subject -- 0000000000000000000000000000000000000000 "${tmp_dir}/fixture.tar.gz" > "${tmp_dir}/subject.json"
          grep -q 'velnor.fixture.release-subject.v1' "${tmp_dir}/subject.json"
          mkdir -p evidence
          cargo run --quiet --locked -p fixture-harness --bin evidence -- \
            --scenario backend-parity \
            --lane "${LANE,,}" \
            --field examples=command_files,artifact_tree,cache_payload,release_subject \
            --field backend="${BACKEND}" \
            --field result=pass \
            --output "evidence/backend-${LANE}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-parity-${{ matrix.config.lane }}
          path: evidence/backend-${{ matrix.config.lane }}.json
          if-no-files-found: error
      - name: Guest docker is not the host control plane
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker run --rm --network none busybox:1.36 echo ok

  compare:
    name: compare backend lanes
    needs: [parity]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'both')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require both backend lanes to pass
        env:
          PARITY_RESULT: ${{ needs.parity.result }}
        run: test "${PARITY_RESULT}" = success
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-parity-GitHub
          path: artifacts/github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-parity-Velnor
          path: artifacts/velnor
      - name: Compare backend semantic evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "github": (Path("artifacts/github/backend-GitHub.json"), {"github-hosted"}),
              "velnor": (Path("artifacts/velnor/backend-Velnor.json"), {"docker", "microvm"}),
          }

          def load(lane, path, backends):
              if not path.is_file():
                  raise SystemExit(f"missing {lane} evidence: {path}")
              files = sorted(item for item in path.parent.rglob("*") if item.is_file())
              if files != [path]:
                  raise SystemExit(f"unexpected {lane} evidence files: {files}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("schema") != "velnor.fixture.evidence.v1":
                  raise SystemExit(f"invalid {lane} evidence schema")
              if payload.get("scenario") != "backend-parity" or payload.get("lane") != lane:
                  raise SystemExit(f"invalid {lane} evidence identity")
              fields = payload.get("fields")
              if not isinstance(fields, dict) or fields.get("backend") not in backends:
                  raise SystemExit(f"invalid {lane} backend identity")
              if fields.get("result") != "pass":
                  raise SystemExit(f"{lane} backend result is not pass")
              return payload

          github = load("github", *expected["github"])
          velnor = load("velnor", *expected["velnor"])
          github["fields"].pop("backend")
          velnor["fields"].pop("backend")
          github.pop("lane")
          velnor.pop("lane")
          if github != velnor:
              raise SystemExit("backend semantic evidence mismatch")
          print("backend semantic evidence matches")
          PY
