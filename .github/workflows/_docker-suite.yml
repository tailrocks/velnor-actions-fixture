name: _docker-suite

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: github | velnor | both
        type: choice
        default: both
        options: [github, velnor, both]
  workflow_call:
    inputs:
      lane: {type: string, required: false, default: both}

permissions:
  contents: read

concurrency:
  group: docker-suite-${{ github.ref }}-${{ inputs.lanes || inputs.lane }}
  cancel-in-progress: false

jobs:
  docker:
    name: docker (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((inputs.lanes || inputs.lane) == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lanes || inputs.lane)) }}
    runs-on: ${{ matrix.lane == 'github' && 'ubuntu-26.04' || fromJSON('{"group":"velnor-trusted","labels":"velnor-target-mvp"}') }}
    timeout-minutes: 30
    env:
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all
          reset: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
        with:
          cosign-release: v3.1.3
          install-dir: "$HOME/.cosign"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Run fixture-harness tests and examples
        run: |
          set -euo pipefail
          cargo nextest run --locked -p fixture-harness --all-targets
          cargo run --quiet --locked -p fixture-harness --example command_files
          tmp_dir="$(mktemp -d)"
          mkdir -p "${tmp_dir}/tree/nested"
          printf '%s\n' alpha > "${tmp_dir}/tree/nested/a.txt"
          cargo run --quiet --locked -p fixture-harness --example artifact_tree -- "${tmp_dir}/tree" > "${tmp_dir}/tree.txt"
          test -s "${tmp_dir}/tree.txt"
          cargo run --quiet --locked -p fixture-harness --example cache_payload -- docker "${LANE}" > "${tmp_dir}/cache.txt"
          grep -q '^velnor.fixture.cache.v1$' "${tmp_dir}/cache.txt"
          printf '%s\n' release > "${tmp_dir}/fixture.tar.gz"
          cargo run --quiet --locked -p fixture-harness --example release_subject -- 0000000000000000000000000000000000000000 "${tmp_dir}/fixture.tar.gz" > "${tmp_dir}/subject.json"
          grep -q 'velnor.fixture.release-subject.v1' "${tmp_dir}/subject.json"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.fixture
          tags: velnor-actions-fixture:${{ matrix.lane }}
          load: true
      - name: Verify built image and write evidence
        run: |
          set -euo pipefail
          test "$(docker run --rm "velnor-actions-fixture:${LANE}")" = fixture::app-a
          mkdir -p evidence
          cargo run --quiet --locked -p fixture-harness --bin evidence -- \
            --scenario docker \
            --lane "${LANE}" \
            --field adapters=setup-qemu,cosign,buildx,build-push \
            --field examples=command_files,artifact_tree,cache_payload,release_subject \
            --field image=fixture::app-a \
            --field result=pass \
            --output "evidence/docker-${LANE}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-docker-${{ matrix.lane }}
          path: evidence/docker-${{ matrix.lane }}.json
          if-no-files-found: error

  compare:
    name: compare Docker lanes
    if: (inputs.lanes || inputs.lane) == 'both'
    needs: [docker]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-docker-*
          path: artifacts
      - name: Compare deterministic Docker evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = {}
          for path in Path("artifacts").rglob("*.json"):
              payload = json.loads(path.read_text())
              if payload.get("scenario") == "docker":
                  rows[payload["lane"]] = payload
          if set(rows) != {"github", "velnor"}:
              raise SystemExit(f"missing Docker evidence lanes: {sorted(rows)}")
          github = rows["github"]
          velnor = rows["velnor"]
          github.pop("lane", None)
          velnor.pop("lane", None)
          if github != velnor:
              raise SystemExit("Docker evidence mismatch")
          print("Docker lane evidence matches")
          PY
