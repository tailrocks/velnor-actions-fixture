name: renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  renovate:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON('[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]') }}
    runs-on: ${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache
          key: renovate-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: renovate-${{ matrix.config.lane }}-${{ runner.os }}-
      - if: matrix.config.writer
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          configurationFile: renovate.json
        env:
          # The PAT named "tailrocks-renovate" (fine-grained, not classic) must be
          # stored in the repo secret GH_RENOVATE_TOKEN.
          GH_RENOVATE_TOKEN: ${{ secrets.GH_RENOVATE_TOKEN }}
          RENOVATE_REPOSITORY_CACHE: enabled
      - if: ${{ !matrix.config.writer }}
        run: echo 'Read-only comparison lane; Renovate mutation skipped.'
      # Renovate container writes cache files as a different uid; restore ownership
      # so the actions/cache post step can save them.
      - if: always()
        run: sudo chown -R "$(whoami)" /tmp/renovate 2>/dev/null || true
