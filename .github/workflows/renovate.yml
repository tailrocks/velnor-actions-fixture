name: renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  renovate:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON('[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .renovate/cache
          key: renovate-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: renovate-${{ matrix.config.lane }}-${{ runner.os }}-
      - name: Prepare workspace-owned Renovate cache
        run: |
          install -d -m 0777 .renovate .renovate/cache .renovate/repos
          chmod -R a+rwX .renovate
      - if: matrix.config.writer
        uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          configurationFile: renovate.json
        env:
          # The PAT named "tailrocks-renovate" (fine-grained, not classic) must be
          # stored in the repo secret GH_RENOVATE_TOKEN.
          GH_RENOVATE_TOKEN: ${{ secrets.GH_RENOVATE_TOKEN }}
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_BASE_DIR: /github/workspace/.renovate
      - if: ${{ !matrix.config.writer }}
        run: echo 'Read-only comparison lane; Renovate mutation skipped.'
