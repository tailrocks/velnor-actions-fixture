name: schedule

on:
  schedule:
    - cron: '0 4 * * 0'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  scheduled-check:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON('[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]') }}
    runs-on: ${{ matrix.config.runner }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fixture-schedule-${{ matrix.config.lane }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fixture-schedule-${{ matrix.config.lane }}-${{ runner.os }}-
      - run: cargo check --workspace --locked
      - run: |
          {
            echo "### scheduled-check (${{ matrix.config.lane }})"
            echo "- event: ${EVENT_NAME}"
            echo "- ref: ${{ github.ref }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  schedule-required:
    if: always()
    needs: [scheduled-check]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/aggregate-needs
        with:
          needs-json: ${{ toJSON(needs) }}
          workflow-label: schedule
