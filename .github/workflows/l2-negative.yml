name: l2-negative

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Runner lane.
        required: true
        type: choice
        options: [velnor, github]
      case:
        description: Fail-before-effect case.
        required: true
        type: choice
        options: [mutable-ref, unknown-repository, unknown-subpath-input, unresolved-expression, invalid-lock]

permissions:
  contents: read

concurrency:
  group: l2-negative-${{ github.ref }}-${{ inputs.lane }}-${{ inputs.case }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  admit-default-head:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require current default-branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          default_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "${GITHUB_SHA}" = "${default_head}"

  github-scanner:
    needs: admit-default-head
    if: inputs.lane == 'github'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: l2-negative-target-github-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: l2-negative-target-github-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      - id: scan
        name: Reject before project marker
        continue-on-error: true
        env:
          CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          case "${CASE}" in
            mutable-ref|unknown-repository|unresolved-expression)
              cargo run --locked -p l2-contract -- validate-file ".github/fixtures/l2/${CASE}.json"
              ;;
            unknown-subpath-input)
              cargo run --locked -p l2-contract -- validate-file .github/fixtures/l2/unknown-subpath.json
              ;;
            invalid-lock)
              cargo run --locked -p l2-contract -- validate-lock .github/fixtures/l2/invalid-mise.lock
              ;;
            *) exit 2 ;;
          esac
      - name: Assert normalized rejection and no project effect
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          test "${OUTCOME}" = failure
          test ! -e .l2-negative-marker
          test ! -e .l2-negative-project

  velnor-mutable-ref:
    needs: admit-default-head
    if: inputs.lane == 'velnor' && inputs.case == 'mutable-ref'
    runs-on:
      group: velnor-trusted
      labels: velnor-target-mvp
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
      - run: touch .l2-negative-marker && exit 1

  velnor-unknown-repository:
    needs: admit-default-head
    if: inputs.lane == 'velnor' && inputs.case == 'unknown-repository'
    runs-on:
      group: velnor-trusted
      labels: velnor-target-mvp
    timeout-minutes: 10
    steps:
      - uses: untrusted/unknown@0123456789abcdef0123456789abcdef01234567
      - run: touch .l2-negative-marker && exit 1

  velnor-unknown-subpath-input:
    needs: admit-default-head
    if: inputs.lane == 'velnor' && inputs.case == 'unknown-subpath-input'
    runs-on:
      group: velnor-trusted
      labels: velnor-target-mvp
    timeout-minutes: 10
    steps:
      - uses: actions/cache/bogus@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .l2-cache
          key: never-materialized
      - run: touch .l2-negative-marker && exit 1

  velnor-unresolved-expression:
    needs: admit-default-head
    if: inputs.lane == 'velnor' && inputs.case == 'unresolved-expression'
    runs-on:
      group: velnor-trusted
      labels: velnor-target-mvp
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .l2-cache
          key: never-materialized
          lookup-only: ${{ runner.debug }}
      - run: touch .l2-negative-marker && exit 1

  velnor-invalid-lock:
    needs: admit-default-head
    if: inputs.lane == 'velnor' && inputs.case == 'invalid-lock'
    runs-on:
      group: velnor-trusted
      labels: velnor-target-mvp
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Reject disposable lock before project command
        run: cargo run --locked -p l2-contract -- validate-lock .github/fixtures/l2/invalid-mise.lock
      - run: touch .l2-negative-project && exit 1
