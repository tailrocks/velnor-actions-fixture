name: multi-arch

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Runner lane(s): velnor / github / both'
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read
  packages: write

concurrency:
  group: multi-arch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DIGEST_DIR: /tmp/fixture-digests

jobs:
  # Per-platform build — mirrors Jackin construct.yml multi-arch matrix pattern.
  # Each lane builds for its platform, uploads a digest artifact.
  build:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","platform":"linux/amd64","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","platform":"linux/amd64","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","platform":"linux/amd64","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","platform":"linux/amd64","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ matrix.config.platform }}
      LANE: ${{ matrix.config.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/fixture-multi
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: Dockerfile.fixture
          platforms: ${{ matrix.config.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE=app-a
          cache-from: type=gha,scope=fixture-multi-${{ matrix.config.lane }}-${{ matrix.config.platform }}
          cache-to: type=gha,scope=fixture-multi-${{ matrix.config.lane }}-${{ matrix.config.platform }},mode=max
          outputs: type=image,push-by-digest=false,name-canonical=true
      - run: |
          mkdir -p "${DIGEST_DIR}"
          echo "${{ steps.build.outputs.digest }}" > "${DIGEST_DIR}/${LANE}-${PLATFORM//\//-}.digest"
          echo "### build digest (${LANE} ${PLATFORM})" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          cat "${DIGEST_DIR}/${LANE}-${PLATFORM//\//-}.digest" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.config.lane }}-${{ matrix.config.platform == 'linux/amd64' && 'amd64' || matrix.config.platform == 'linux/arm64' && 'arm64' || 'unknown' }}
          path: ${{ env.DIGEST_DIR }}
          if-no-files-found: error

  # Manifest merge — mirrors Jackin construct.yml publish-manifest pattern.
  # Downloads all platform digests and merges using merge-multiple: true.
  merge-manifests:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      DIGEST_DIR: /tmp/fixture-digests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'digest-*'
          path: ${{ env.DIGEST_DIR }}
          merge-multiple: true
      - run: |
          echo "### merged digests" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          find "${DIGEST_DIR}" -name '*.digest' | sort | while read -r f; do
            echo "$(basename "$f"): $(cat "$f")"
          done >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "merge-manifests passed"
      - uses: ./.github/actions/aggregate-needs
        with:
          expected: success
          actual: ${{ needs.build.result }}
