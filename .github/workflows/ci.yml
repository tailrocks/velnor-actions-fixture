name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]
  merge_group:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      lanes:
        description: github | velnor | both
        type: choice
        default: both
        options: [github, velnor, both]
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
# Every automatic positive path runs both lanes. A single manual lane is
# diagnostic only and cannot produce the readiness verdict.
jobs:
  contract-audit:
    name: contract and readiness audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.run_id }}-contract-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit capability contract
        run: python3 .github/scripts/audit_capability_coverage.py --contract-only
      - name: Audit workflow surface
        run: python3 .github/scripts/audit_workflow_surface.py
      - name: Audit readiness coverage
        run: python3 .github/scripts/audit_capability_coverage.py

  rust:
    uses: ./.github/workflows/_rust-suite.yml
    with:
      lane: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || github.event_name == 'pull_request' && 'both' || github.event_name == 'merge_group' && 'both' || github.event_name == 'push' && 'both' || github.event_name == 'schedule' && 'both' }}
  runtime:
    uses: ./.github/workflows/_runtime-suite.yml
    with:
      lane: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || github.event_name == 'pull_request' && 'both' || github.event_name == 'merge_group' && 'both' || github.event_name == 'push' && 'both' || github.event_name == 'schedule' && 'both' }}
  actions:
    uses: ./.github/workflows/_actions-suite.yml
    with:
      lane: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || github.event_name == 'pull_request' && 'both' || github.event_name == 'merge_group' && 'both' || github.event_name == 'push' && 'both' || github.event_name == 'schedule' && 'both' }}
  docker:
    uses: ./.github/workflows/_docker-suite.yml
    with:
      lane: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || github.event_name == 'pull_request' && 'both' || github.event_name == 'merge_group' && 'both' || github.event_name == 'push' && 'both' || github.event_name == 'schedule' && 'both' }}

  lane-verdict:
    name: exact two-lane evidence verdict
    if: always()
    needs: [contract-audit, rust, runtime, actions, docker]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.run_id }}-lane-verdict
      cancel-in-progress: false
    steps:
      - name: Require all positive prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; n=json.loads(sys.argv[1]); print("prerequisite results:", n); sys.exit(any(v["result"] != "success" for v in n.values()))' "$NEEDS"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-rust-*
          path: artifacts/rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: artifacts/runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-actions-*
          path: artifacts/actions
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-docker-*
          path: artifacts/docker
      - name: Require exact GitHub and Velnor evidence for every suite
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              ("rust", lane, package)
              for lane in ("github", "velnor")
              for package in ("app-a", "app-b")
          }
          expected |= {
              ("runtime", lane, package)
              for lane in ("github", "velnor")
              for package in ("app-a", "app-b")
          }
          expected |= {
              (scenario, lane, "")
              for scenario in ("actions", "docker")
              for lane in ("github", "velnor")
          }
          observed = set()
          for path in Path("artifacts").rglob("*.json"):
              payload = json.loads(path.read_text())
              if payload.get("scenario") == "rust":
                  observed.add(("rust", payload["lane"], payload["fields"]["package"]))
              elif payload.get("scenario") in {"actions", "docker"}:
                  observed.add((payload["scenario"], payload["lane"], ""))
              elif payload.get("lane") in {"github", "velnor"}:
                  harness = payload.get("evidence", {}).get("harness", {})
                  if harness.get("scenario") == "runtime":
                      observed.add(("runtime", payload["lane"], payload["package"]))
          if observed != expected:
              missing = sorted(expected - observed)
              extra = sorted(observed - expected)
              raise SystemExit(f"exact lane evidence mismatch; missing={missing}; extra={extra}")
          print(f"exact two-lane evidence verified ({len(expected)} semantic records)")
          PY

  ci-required:
    if: always()
    needs: [contract-audit, rust, runtime, actions, docker, lane-verdict]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.run_id }}-required
      cancel-in-progress: false
    steps:
      - name: Require every selected suite
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; n=json.loads(sys.argv[1]); print("suite results:", n); sys.exit(any(v["result"] != "success" for v in n.values()))' "$NEEDS"
