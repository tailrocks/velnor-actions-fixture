name: pages

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Runner lane(s): velnor / github / both'
        type: choice
        default: velnor
        options: [velnor, github, both]
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fixture-pages-${{ matrix.config.lane }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fixture-pages-${{ matrix.config.lane }}-${{ runner.os }}-
      - run: cargo doc --no-deps --workspace
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
          name: github-pages-${{ matrix.config.lane }}
      - uses: ./.github/actions/check-deployed-docs
        with:
          artifact-name: github-pages-${{ matrix.config.lane }}

  deploy:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-github
