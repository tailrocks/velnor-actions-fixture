# Repo-owned scheduled driver for the L2 rejection probes. l2-negative.yml
# cannot run on pull requests by design (admit-default-head requires the
# main head), so this workflow dispatches all six cases on main pushes and
# the Sunday schedule and asserts every child run concludes green: the L2
# probes are self-asserting, so green means every rejection held and red
# means the fleet admitted something it must refuse. attestation-negative
# stays dispatch-only (its probe jobs conclude red by design and need
# generator-side rework) and app-token-probe stays dispatch-only
# (secret-gated); see fixtures/resilience/catalogue.json. Follows the
# fixture #143 hand-owned pattern. Not generator output: edit here.
name: rejection-schedule

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Single flight: each dispatch is correlated to exactly one newly-created child
# run and that run's case-specific evidence before its conclusion is trusted.
concurrency:
  group: rejection-schedule-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci-negative-contract:
    name: verify L2 rejection corpus
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: rejection-schedule-${{ github.run_id }}-ci-contract
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain', 'mise.toml', 'mise.lock', '**/Cargo.toml') }}
          restore-keys: |
            velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
          save-on-workflow-dispatch: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Require every negative corpus case to fail before effect
        run: |
          set -euo pipefail
          expect_rejection() {
            local case_name="$1"
            shift
            if "$@"; then
              echo "::error::L2 rejection case ${case_name} was accepted"
              return 1
            fi
            echo "${case_name}: rejected before effect"
          }
          expect_rejection mutable-ref cargo run --locked -p l2-contract -- validate-file fixtures/l2/mutable-ref.json
          expect_rejection unknown-repository cargo run --locked -p l2-contract -- validate-file fixtures/l2/unknown-repository.json
          expect_rejection unknown-input cargo run --locked -p l2-contract -- validate-file fixtures/l2/unknown-input.json
          expect_rejection unknown-subpath-input cargo run --locked -p l2-contract -- validate-file fixtures/l2/unknown-subpath.json
          expect_rejection unresolved-expression cargo run --locked -p l2-contract -- validate-file fixtures/l2/unresolved-expression.json
          expect_rejection invalid-lock cargo run --locked -p l2-contract -- validate-lock fixtures/l2/invalid-mise.lock

  drive-l2-negatives:
    name: drive L2 rejection probes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: rejection-schedule-${{ github.run_id }}-drive
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch every L2 negative case and assert green
        run: |
          set -euo pipefail
          workflow="l2-negative.yml"
          fresh_runs() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${workflow}" --branch main --limit 100 --json databaseId,createdAt,event,headBranch,headSha,status,conclusion --jq '[.[] | select(.event == "workflow_dispatch") | select(.headBranch == "main")] | sort_by(.createdAt)'
          }

          find_child_for_dispatch() {
            local before_json="$1"
            local expected_case="$2"
            local dispatch_started="$3"
            local deadline
            deadline=$(( $(date +%s) + 300 ))
            while [[ "$(date +%s)" -lt "${deadline}" ]]; do
              local after candidates candidate_count candidate_id candidate_status
              local artifact_dir evidence_file
              after="$(fresh_runs)"
              candidates="$(jq -c \
                --argjson before "${before_json}" \
                --arg floor "${dispatch_started}" \
                --arg sha "${GITHUB_SHA}" \
                '[.[] | select(.createdAt >= $floor and .headSha == $sha) | . as $run | select(($before | index($run.databaseId)) == null)]' \
                <<<"${after}")"
              candidate_count="$(jq 'length' <<<"${candidates}")"
              if [[ "${candidate_count}" -gt 1 ]]; then
                echo "case=${expected_case}: dispatch matched multiple new child runs" >&2
                return 1
              fi
              if [[ "${candidate_count}" == 1 ]]; then
                candidate_id="$(jq -r '.[0].databaseId' <<<"${candidates}")"
                candidate_status="$(jq -r '.[0].status' <<<"${candidates}")"
                if [[ "${candidate_status}" == completed ]]; then
                  artifact_dir="${RUNNER_TEMP}/rejection-schedule-${GITHUB_RUN_ID}-${expected_case}"
                  mkdir -p "${artifact_dir}"
                  if gh run download "${candidate_id}" --repo "${GITHUB_REPOSITORY}" --name l2-negative-github --dir "${artifact_dir}" >/dev/null 2>&1; then
                    evidence_file="$(find "${artifact_dir}" -type f -name l2-negative-github.json -print -quit)"
                    if [[ -n "${evidence_file}" ]] && jq -e --arg expected_case "${expected_case}" '(.case == $expected_case and .lane == "github" and .status == "passed" and .fail_before_effect == true)' "${evidence_file}" >/dev/null; then
                      echo "${candidate_id}"
                      return 0
                    fi
                  fi
                  echo "case=${expected_case}: child ${candidate_id} completed without matching case evidence" >&2
                  return 1
                fi
              fi
              sleep 10
            done
            echo "case=${expected_case}: initiating dispatch did not yield one correlated child run" >&2
            return 1
          }

          dispatched=()
          for case in mutable-ref unknown-repository unknown-input unknown-subpath-input unresolved-expression invalid-lock; do
            echo "dispatching l2-negative case=${case}"
            dispatch_started="$(date -u +%FT%TZ)"
            before="$(fresh_runs | jq -c '[.[].databaseId]')"
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref main -f case="${case}" -f lanes=both >/dev/null
            run_id="$(find_child_for_dispatch "${before}" "${case}" "${dispatch_started}")"
            echo "case=${case}: run ${run_id}"
            dispatched+=("${case}=${run_id}")
          done
          failures=0
          for pair in "${dispatched[@]}"; do
            case="${pair%%=*}"
            run_id="${pair##*=}"
            run_state="unknown"
            deadline=$(( $(date +%s) + 1500 ))
            while [[ "$(date +%s)" -lt "${deadline}" ]]; do
              run_state="$(gh api --repo "${GITHUB_REPOSITORY}" "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '"\(.status)/\(.conclusion // "none")"')"
              if [[ "${run_state}" == completed/* ]]; then break; fi
              sleep 15
            done
            if [[ "${run_state}" != "completed/success" ]]; then
              echo "case=${case}: want completed/success, got ${run_state}" >&2
              failures=$((failures + 1))
            else
              echo "case=${case}: rejection held"
            fi
          done
          test "${failures}" = 0
