              success|skipped) ;;
              *) echo "unselected CI job velnor-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-app-a,"* ]]; then
            result="$(result_for_job prepare-cargo)"
            if [[ "$result" != success ]]; then
              echo "selected CI prerequisite prepare-cargo did not pass: $result" >&2
              exit 1
            fi
          else
            result="$(result_for_job prepare-cargo)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI prerequisite prepare-cargo failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-app-a,"* ]]; then
            result="$(result_for_job github-rust-app-a)"
            case "$result" in
              success) ;;
              *) echo "selected CI job github-rust-app-a did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job github-rust-app-a)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-app-a failed unexpectedly: $result" >&2; exit 1 ;;
            esac
