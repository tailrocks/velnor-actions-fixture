            esac
          fi
          if [[ "$selected" == *",docker,"* ]]; then
            result="$(result_for_job velnor-docker)"
            if [[ "$FORK_PR" == true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-docker did not pass: $result" >&2; exit 1 ;;
