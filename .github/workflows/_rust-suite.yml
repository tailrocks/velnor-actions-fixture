name: _rust-suite

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: github | velnor | both
        type: choice
        default: both
        options: [github, velnor, both]
  workflow_call:
    inputs:
      lane: {type: string, required: false, default: both}

permissions:
  contents: read

concurrency:
  group: rust-suite-${{ github.ref }}-${{ inputs.lanes || inputs.lane }}
  cancel-in-progress: false

jobs:
  rust:
    name: rust (${{ matrix.lane }}, ${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((inputs.lanes || inputs.lane) == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lanes || inputs.lane)) }}
        package: [app-a, app-b]
    runs-on: ${{ matrix.lane == 'github' && 'ubuntu-26.04' || fromJSON('{"group":"velnor-trusted","labels":"velnor-target-mvp"}') }}
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.lane }}-${{ matrix.package }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.lane }}-${{ matrix.package }}-
      - run: rustup component add rustfmt clippy
      - run: just fmt-check
      - run: just clippy "${{ matrix.package }}"
      - run: just nextest "${{ matrix.package }}"
      - name: Run fixture-harness tests and examples
        env:
          LANE: ${{ matrix.lane }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          cargo test --locked -p fixture-harness --all-targets
          cargo run --quiet --locked -p fixture-harness --example command_files
          tmp_dir="$(mktemp -d)"
          mkdir -p "${tmp_dir}/tree/nested"
          printf '%s\n' alpha > "${tmp_dir}/tree/nested/a.txt"
          cargo run --quiet --locked -p fixture-harness --example artifact_tree -- "${tmp_dir}/tree" > "${tmp_dir}/tree.txt"
          test -s "${tmp_dir}/tree.txt"
          cargo run --quiet --locked -p fixture-harness --example cache_payload -- cargo "${LANE}-${PACKAGE}" > "${tmp_dir}/cache.txt"
          grep -q '^velnor.fixture.cache.v1$' "${tmp_dir}/cache.txt"
          printf '%s\n' release > "${tmp_dir}/fixture.tar.gz"
          cargo run --quiet --locked -p fixture-harness --example release_subject -- 0000000000000000000000000000000000000000 "${tmp_dir}/fixture.tar.gz" > "${tmp_dir}/subject.json"
          grep -q 'velnor.fixture.release-subject.v1' "${tmp_dir}/subject.json"
          mkdir -p evidence
          cargo run --quiet --locked -p fixture-harness --bin evidence -- \
            --scenario rust \
            --lane "${LANE}" \
            --field "package=${PACKAGE}" \
            --field examples=command_files,artifact_tree,cache_payload,release_subject \
            --field tests=fixture-harness-all-targets \
            --output "evidence/rust-${LANE}-${PACKAGE}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-rust-${{ matrix.lane }}-${{ matrix.package }}
          path: evidence/rust-${{ matrix.lane }}-${{ matrix.package }}.json
          if-no-files-found: error

  compare:
    name: compare rust lanes
    if: (inputs.lanes || inputs.lane) == 'both'
    needs: [rust]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-rust-*
          path: artifacts
      - name: Compare deterministic Rust evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = {}
          for path in Path("artifacts").rglob("*.json"):
              payload = json.loads(path.read_text())
              if payload.get("scenario") == "rust":
                  fields = payload["fields"]
                  rows[(payload["lane"], fields["package"])] = payload
          for package in ("app-a", "app-b"):
              try:
                  github = rows[("github", package)]
                  velnor = rows[("velnor", package)]
              except KeyError as error:
                  raise SystemExit(f"missing Rust evidence: {error}")
              github.pop("lane", None)
              velnor.pop("lane", None)
              if github != velnor:
                  raise SystemExit(f"Rust evidence mismatch for {package}")
          print("Rust lane evidence matches (2 package(s) compared)")
          PY
